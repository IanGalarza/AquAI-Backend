[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aquai-backend"
version = "0.1.0"
description = "Backend de AquAI desarrollado en Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "qdrant-client",
    "langgraph",
    "pandas",
    "numpy",
    "openpyxl",
    "plotly",
    "pymupdf",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "jsonschema>=4",
    "python-multipart",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aquai.infrastructure.config" = ["tabular_rules.json"]
