[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aquai-backend"
version = "0.1.0"
description = "Backend de AquAI desarrollado en Python."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "qdrant-client>=1.19,<2",
    "langgraph>=1.2,<2",
    "pandas",
    "plotly>=7.1,<8",
    "openpyxl",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "python-multipart",
    "docling>=2.146,<2.147",
    "docling-core>=2.106,<3",
    "rapidocr>=3.10,<3.11",
    "semchunk",
    "transformers",
    "numpy",
    "onnxruntime>=1.24,<2",
    "pypdfium2>=5,<6",
]

[tool.setuptools.packages.find]
where = ["src"]
